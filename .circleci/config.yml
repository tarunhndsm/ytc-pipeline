version: 2.1

# @ankahi.kathayein's Reels (pipeline/src/ytc/reel_host.py). The project's two schedules set `run`: "reels" at 15
# past every hour, "factory" at 40 past. A push (the copy from the private repo) runs nothing.

parameters:
  run:
    type: enum
    enum: [none, reels, factory, selftest]
    default: none
  dry:
    type: boolean
    default: false
  force:
    type: boolean
    default: false

executors:
  python:
    docker:
      - image: cimg/python:3.12
    environment:
      HF_HOME: /home/circleci/.cache/huggingface
      PYTHONUNBUFFERED: "1"

commands:
  install:
    steps:
      - run:
          name: Note when the job has to be done
          # The free plan stops a job at one hour; the factory starts no step it can't finish by AK_UNTIL.
          command: echo "export AK_UNTIL=$(date -u -d '+50 minutes' +%Y-%m-%dT%H:%M:%S+00:00)" >> "$BASH_ENV"
      - checkout
      - run: python3 --version > /tmp/python-version
      - restore_cache:
          keys:
            - venv-v1-{{ checksum "/tmp/python-version" }}-{{ checksum "pipeline/uv.lock" }}
      - run:
          name: Install
          working_directory: pipeline
          command: |
            python3 -m pip install --quiet "uv>=0.9,<0.10"
            python3 -m uv sync --frozen
      - save_cache:
          key: venv-v1-{{ checksum "/tmp/python-version" }}-{{ checksum "pipeline/uv.lock" }}
          paths:
            - pipeline/.venv

jobs:
  reels:
    executor: python
    resource_class: medium
    # Branches on the parameters themselves: a boolean put in a step's environment didn't reach the shell as "true".
    steps:
      - install
      - when:
          condition: << pipeline.parameters.dry >>
          steps:
            - run:
                name: Say what a reels run would do, changing nothing
                working_directory: pipeline
                no_output_timeout: 50m
                command: .venv/bin/python -m ytc.reel_host reels --dry
      - unless:
          condition: << pipeline.parameters.dry >>
          steps:
            - run:
                name: Judge, book and mirror
                working_directory: pipeline
                no_output_timeout: 50m
                command: .venv/bin/python -m ytc.reel_host reels
  factory:
    executor: python
    resource_class: large
    steps:
      - install
      - when:
          condition: << pipeline.parameters.force >>
          steps:
            - run:
                name: Make a Reel, even with the calendar full
                working_directory: pipeline
                no_output_timeout: 55m
                command: .venv/bin/python -m ytc.reel_host factory --until "$AK_UNTIL" --force
      - unless:
          condition: << pipeline.parameters.force >>
          steps:
            - run:
                name: Make a Reel when the calendar runs short
                working_directory: pipeline
                no_output_timeout: 55m
                command: .venv/bin/python -m ytc.reel_host factory --until "$AK_UNTIL"
  selftest:
    executor: python
    resource_class: medium
    steps:
      - install
      - run:
          name: Check the keys, the clone, the releases and ffmpeg
          working_directory: pipeline
          command: .venv/bin/python -m ytc.reel_host selftest

workflows:
  reels:
    when:
      equal: [reels, << pipeline.parameters.run >>]
    jobs:
      - reels:
          serial-group: ytc-pipeline/reels
  factory:
    when:
      equal: [factory, << pipeline.parameters.run >>]
    jobs:
      - factory:
          serial-group: ytc-pipeline/factory
  selftest:
    when:
      equal: [selftest, << pipeline.parameters.run >>]
    jobs:
      - selftest
